name: build-linux

# PyInstaller 不能交叉编译：Linux 产物必须在 Linux 上打。
# 这个 workflow 跑在 GitHub 的 ubuntu runner 上，产出单文件 ELF，
# 推 tag 时自动挂到 Release。

on:
  workflow_dispatch:
  push:
    branches: [linux, main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libtk8.6 libx11-6 libxext6 libxrender1 ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.21"

      - name: 冒烟（无显示环境下只验导入）
        run: |
          python -c "import vbhelper.platform as p; print('platform:', p.IS_LINUX)"
          python -m compileall -q vbhelper
          python - <<'PY'
          from vbhelper.features import catalog
          print("features:", [c.id for c in catalog()])
          PY

      - name: 打包
        run: python -m PyInstaller --clean --distpath dist --workpath build VBHelper.spec

      - name: 整理产物
        run: |
          mv dist/VBHelper dist/VBHelper-linux-x86_64
          chmod +x dist/VBHelper-linux-x86_64
          sha256sum dist/VBHelper-linux-x86_64 | tee dist/SHA256-linux.txt
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: VBHelper-linux-x86_64
          path: |
            dist/VBHelper-linux-x86_64
            dist/SHA256-linux.txt

      - name: 附加到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/VBHelper-linux-x86_64
            dist/SHA256-linux.txt
